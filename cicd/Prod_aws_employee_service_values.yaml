namespace: employee

replicaCount: 2

image:
  repository: 196253397204.dkr.ecr.ap-south-1.amazonaws.com/employee-service
  pullPolicy: IfNotPresent
  tag: latest

nameOverride: ""
fullnameOverride: "employee-service"

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1024Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2

profile:
  - name: APP_ENV
    value: prod

serviceAccount:
  create: true
  annotations: {}
  name: ""

ingress:
  enabled: false

nodeSelector: {}

tolerations: []

affinity: {}