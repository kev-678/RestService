name: Employee Service CI/CD

# Manual trigger from GitHub Actions UI
on:
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: employee-service

jobs:

  # ==================================================
  # CI + Build Docker Image + Push to Amazon ECR
  # ==================================================
  build-and-push:

    runs-on: ubuntu-latest

    # Pass ECR registry address to deploy job
    outputs:
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: employee_db
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U user -d employee_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v7


      # 2. Setup Java
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven


      # 3. Build + Test Spring Boot application
      - name: Build application
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/employee_db
          SPRING_DATASOURCE_USERNAME: user
          SPRING_DATASOURCE_PASSWORD: password
        run: mvn clean package


      # 4. Login to Docker Hub
      # Used for pulling public/base Docker images
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}


      # 5. Build Docker image locally
      # Dockerfile pulls eclipse-temurin:21-jdk from Docker Hub
      - name: Build Docker image
        run: |
          docker build \
            -t employee-service:latest \
            -t employee-service:${{ github.sha }} \
            .


      # 6. Authenticate GitHub runner to AWS
      # IAM User credentials -> Assume ECR Push Role
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-duration-seconds: 3600
          role-skip-session-tagging: true
          aws-region: ${{ env.AWS_REGION }}


      # 7. Login Docker client to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # 8. Tag local Docker image for ECR
      - name: Tag Docker image for ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag \
            employee-service:$IMAGE_TAG \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          docker tag \
            employee-service:latest \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest


      # 9. Push Docker image to ECR
      - name: Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest


  # ==================================================
  # CD - Deploy ECR Image to EC2
  # ==================================================
  deploy:

    runs-on: ubuntu-latest

    needs: build-and-push

    steps:

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-duration-seconds: 3600
          role-skip-session-tagging: true
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name employee-service-cluster

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Deploy to EKS
        run: |
          helm upgrade --install employee-service \
            helm/employee-service \
            --namespace employee \
            --set image.repository=${{ needs.build-and-push.outputs.ecr_registry }}/${{ env.ECR_REPOSITORY }} \
            --set image.tag=${{ github.sha }} \
            --wait \
            --timeout 10m

      - name: Verify deployment
        run: |
          kubectl get pods -n employee
          kubectl get deployments -n employee
          kubectl get services -n employee