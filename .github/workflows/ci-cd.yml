name: Employee Service CI/CD

# Manual trigger from GitHub Actions UI
on:
  workflow_dispatch:

jobs:

  # =========================
  # CI + Docker Image Push
  # =========================
  build-and-push:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: employee_db
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U user -d employee_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v7

      # 2. Setup Java
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3. Build + Test
      - name: Build application
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/employee_db
          SPRING_DATASOURCE_USERNAME: user
          SPRING_DATASOURCE_PASSWORD: password
        run: mvn clean package

      # 4. Login Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # 5. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/employee-service:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/employee-service:${{ github.sha }} \
            .

      # 6. Push Docker images
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/employee-service:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/employee-service:${{ github.sha }}


  # =========================
  # CD - Deploy to EC2
  # =========================
  deploy:

    runs-on: ubuntu-latest

    # Deploy only if build-and-push succeeds
    needs: build-and-push

    steps:

      # 7. Configure EC2 SSH key
      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      # 8. SSH into EC2 and deploy latest image
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          ssh -i ~/.ssh/ec2_key \
            "$EC2_USERNAME@$EC2_HOST" \
            "docker compose pull && \
             docker compose up -d && \
             docker compose ps"